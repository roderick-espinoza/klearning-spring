info:
  name: Listar Roles
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/v1/roles"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  auth: none

docs: |-
  Solo accesible con rol ADMIN.

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && Array.isArray(res.body) && res.body.length > 0) {
          bru.setVar("idRolCualquiera", res.body[0].idRol);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
