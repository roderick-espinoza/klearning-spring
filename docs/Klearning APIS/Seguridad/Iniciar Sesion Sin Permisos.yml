info:
  name: Iniciar Sesion Sin Permisos
  type: http
  seq: 2

http:
  method: post
  url: "{{baseUrl}}/api/v1/auth/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "{{usuarioSinPermisos}}",
        "password": "{{passwordSinPermisos}}"
      }
  auth: inherit

docs: |-
  Inicia sesión con un usuario que NO tiene el rol ADMIN.
  Guarda el token en tokenSinPermisos para probar el 403.

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200 && res.body && res.body.token) {
          bru.setVar("tokenSinPermisos", res.body.token);
          console.log(
            `Sesión iniciada como ${res.body.username} con roles ${JSON.stringify(res.body.roles)}`
          );
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
