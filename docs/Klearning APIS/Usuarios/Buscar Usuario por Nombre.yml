info:
  name: Buscar Usuario por Nombre
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/v1/usuarios/buscar?usuario=hquispec"
  headers:
    - name: Authorization
      value: "Bearer {{authToken}}"
  params:
    - name: usuario
      value: hquispec
      type: query
      enabled: true
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
