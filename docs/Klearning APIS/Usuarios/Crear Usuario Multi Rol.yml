info:
  name: Crear Usuario Multi Rol
  type: http
  seq: 3

http:
  method: post
  url: "{{baseUrl}}/api/v1/usuarios"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{authToken}}"
  body:
    type: json
    data: |-
      {
        "idPersona": "{{idPersonaCreada}}",
        "usuario": "ctorres",
        "password": "Clave12345",
        "idsRoles": [
          "{{idRolCreado}}",
          "{{idRolCualquiera}}"
        ]
      }
  auth: none

docs: |-
  Ejecuta antes "Crear Persona", "Crear Rol" y "Listar Roles" para que estén
  cargadas las variables idPersonaCreada, idRolCreado e idRolCualquiera.

  La contraseña se guarda con BCrypt: nunca en texto plano.

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body && res.body.idUsuario) {
          bru.setVar("idUsuarioCreado", res.body.idUsuario);
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
