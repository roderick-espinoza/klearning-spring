<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<div th:fragment="sidebar" class="sidebar-wrapper" data-simplebar="true">
  <div class="sidebar-header">
    <div><i class="ri-brain-2-line fs-2 text-primary"></i></div>
    <div><h4 class="logo-text">KLEARNING</h4></div>
    <div class="toggle-icon ms-auto">
      <i class="bx bx-first-page"></i>
    </div>
  </div>

  <ul class="metismenu" id="menu">
    <li class="mm-active">
      <a href="javascript:;" class="has-arrow">
        <span class="d-flex align-items-center gap-2">
          <i class="bi bi-house-down fs-4"></i>
          <span class="menu-title">Dashboard</span>
        </span>
      </a>
      <ul>
        <li><a th:href="@{/home}">
          <i class="bx bx-right-arrow-alt"></i>Inicio</a></li>
        <li><a th:href="@{/personas}">
          <i class="bx bx-right-arrow-alt"></i>Personas</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/usuarios}">
          <i class="bx bx-right-arrow-alt"></i>Usuarios</a></li>
        <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/roles}">
          <i class="bx bx-right-arrow-alt"></i>Roles</a></li>
      </ul>
    </li>
  </ul>
</div>

</body>
</html>
