<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Inicio</title>
</head>
<body>

<div layout:fragment="content">

  <div th:replace="~{fragments/metrics :: metrics}"></div>

  <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
    <div class="breadcrumb-title pe-3">Dashboard</div>
    <div class="ps-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 p-0">
          <li class="breadcrumb-item">
            <a href="javascript:;"><i class="bx bx-home-alt"></i></a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">Inicio</li>
        </ol>
      </nav>
    </div>
  </div>

  <hr/>

  <div class="row">
    <div class="col">
      <div class="card radius-10">
        <div class="card-body">

          <h5 class="text-primary mb-3">
            <i class="ri-brain-2-line"></i> Bienvenid@ a KLearning
          </h5>

          <p class="mb-1">
            Sesión iniciada como
            <strong sec:authentication="name">usuario</strong>.
          </p>

          <p class="mb-3">
            Roles asignados:
            <span class="badge rounded-pill text-primary bg-light-primary px-3 py-2"
                  sec:authentication="principal.authorities">roles</span>
          </p>

          <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-primary rounded-pill" th:href="@{/personas}">
              <i class="bx bx-group"></i> Personas
            </a>
            <a class="btn btn-outline-success rounded-pill"
               sec:authorize="hasRole('ADMIN')" th:href="@{/usuarios}">
              <i class="bx bx-user-circle"></i> Usuarios
            </a>
            <a class="btn btn-outline-info rounded-pill"
               sec:authorize="hasRole('ADMIN')" th:href="@{/roles}">
              <i class="bx bx-key"></i> Roles
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
