<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>KLEARNING</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="icon"
      th:href="@{/assets/images/logo-klearning.png}"
      type="image/png" />

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" />

<link rel="stylesheet"
      th:href="@{/css/estilos.css}">
</head>

<body>

<div class="container content-blur">


<div class="row py-3 align-items-center">
    <div class="col-4 text-start">
        <h5 class="color-primario mb-0">
            <i class="bi bi-three-dots-vertical"></i>
            KLEARNING
        </h5>
    </div>

    <div class="col-8 text-end fs-4 color-primario">
        <i class="bi bi-moon"></i>
        <i class="bi bi-menu-down"></i>
    </div>
</div>

<div class="row align-items-stretch shadow rounded-3 section-middle">

    <div class="col-md-6 py-4 d-flex justify-content-center border-start border-5 border-secondary rounded-3">

        <div class="p-4 rounded-3 bg-white shadow" style="width: 60%;">

            <div class="row mb-3 color-primario">
                <div class="col-8">
                    <h5>Hola</h5>
                    <h4>¡Bienvenid@!</h4>
                </div>

                <div class="col-4 text-center">
                    <i class="ri-brain-2-line fs-1"></i>
                </div>
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3 position-relative color-primario">
                    <label class="form-label color-texto">
                        Ingresa tu usuario:
                    </label>

                    <i class="bi bi-person-fill icon-input"></i>

					<input type="text"
					       class="form-control rounded-pill input-with-icon"
					       name="username"
					       th:value="${username}">
                </div>

                <div class="mb-3 position-relative">

                    <label class="form-label color-primario">
                        Contraseña:
                    </label>

                    <i class="bi bi-lock-fill icon-input-left"></i>

                    <input id="passwordInput"
                           type="password"
                           name="password"
                           class="form-control rounded-pill input-with-icons">

                    <i id="togglePassword"
                       class="bi bi-eye-fill icon-input-right"
                       role="button"></i>

                    <div class="text-center">
                        <label class="form-label color-texto text-decoration-underline text-secondary">
                            ¿Olvidaste tu contraseña?
                        </label>
                    </div>

                </div>

                <button type="submit"
                        class="rounded-pill d-block mx-auto color-botones">

                    Ingresar
                    <i class="bi bi-box-arrow-in-right icono-btn"></i>

                </button>

            </form>

			<div th:if="${mensaje != null}"
			     class="alert border-0 border-start border-5 border-success alert-dismissible fade show py-2 mt-3">
				 <div class="d-flex align-items-center">
				     <div class="ms-3">
				         <h6 class="mb-0 text-success" th:text="${mensaje}"></h6>
				     </div>
				 </div>
				 <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
			</div>

			<div th:if="${error != null}"
			     class="alert border-0 border-start border-5 border-danger alert-dismissible fade show py-2 mt-3">

				 <div class="d-flex align-items-center">

				     <!-- El titulo estaba fijo en "Credenciales incorrectas" y
				          contradecia al mensaje: en /login?expirado salia junto a
				          "Tu sesion expiro". El texto lo pone el controlador. -->
				     <div class="ms-3">

				         <h6 class="mb-0 text-danger" th:text="${error}"></h6>

				     </div>

				 </div>

				 <button type="button"
				         class="btn-close"
				         data-bs-dismiss="alert">
				 </button>

            </div>

        </div>

    </div>

    <div class="col-md-6 d-flex justify-content-start align-items-stretch py-4 background-index">
    </div>

</div>

<div class="row py-2 align-items-center color-primario">

    <div class="col-8 text-start">
        Derechos reservados. @KLearning 2026
    </div>

    <div class="col-4 text-end fs-3">
        <i class="bi bi-android2 me-2 color-primario"></i>
        <i class="bi bi-apple color-primario"></i>
    </div>

</div>


</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:src="@{/js/login.js}"></script>

</body>
</html>
