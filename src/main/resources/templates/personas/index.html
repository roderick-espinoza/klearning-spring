<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Personas</title>
</head>
<body>

<div layout:fragment="content">

  <div th:replace="~{fragments/metrics :: metrics}"></div>

  <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
    <div class="breadcrumb-title pe-3">Tablas</div>
    <div class="ps-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 p-0">
          <li class="breadcrumb-item">
            <a href="javascript:;"><i class="bx bx-home-alt"></i></a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">Tabla de Personas</li>
        </ol>
      </nav>
    </div>
  </div>

  <hr/>

  <div class="row">
    <div class="col">
      <div class="card radius-10 mb-0">
        <div class="card-body">

          <div class="d-flex align-items-center mb-3">
            <h5 class="mb-0 text-primary">Listado de Personal</h5>
            <div class="ms-auto">
              <button type="button"
                      class="btn btn-primary rounded-pill"
                      onclick="abrirModalNuevo()"
                      data-bs-toggle="modal"
                      data-bs-target="#modalPersona">
                <i class="bi bi-folder-plus"></i> Nueva Persona
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Acciones</th>
                  <th>Apellidos</th>
                  <th>Nombres</th>
                  <th>DNI/CE</th>
                  <th>Sexo</th>
                  <th>Estado Civil</th>
                  <th>Nacionalidad</th>
                  <th>Celular</th>
                  <th>Email</th>
                  <th>Formación</th>
                  <th>Modalidad</th>
                  <th>Skill</th>
                  <th>Estado</th>
                </tr>
              </thead>
              <tbody>

                <tr th:if="${#lists.isEmpty(lista)}">
                  <td colspan="13" class="text-center text-muted">
                    No hay personas registradas
                  </td>
                </tr>

                <tr th:each="p : ${lista}">
                  <td>
                    <div class="d-flex order-actions">

                      <form th:action="@{/personas/eliminar/{id}(id=${p.idPersona})}"
                            method="post"
                            onsubmit="return confirmarEliminar(event)">
                        <button type="submit"
                                class="text-danger bg-light-danger border-0 btn-accion">
                          <i class="bx bxs-trash"></i>
                        </button>
                      </form>

                      <!-- Los enums viajan por su name(), que es exactamente el
                           valor de los <option>, para que el select quede
                           preseleccionado al editar. -->
                      <button type="button"
                              class="ms-2 text-primary bg-light-primary border-0 btn-accion"
                              data-bs-toggle="modal"
                              data-bs-target="#modalPersona"
                              th:attr="data-id=${p.idPersona},
                                       data-apellidos=${p.apellidos},
                                       data-nombres=${p.nombres},
                                       data-dni=${p.dniCe},
                                       data-sexo=${p.sexo?.name()},
                                       data-fechanacimiento=${p.fechaNacimiento},
                                       data-estadocivil=${p.estadoCivil?.name()},
                                       data-nacionalidad=${p.nacionalidad?.name()},
                                       data-celular=${p.celular},
                                       data-email=${p.email},
                                       data-formacion=${p.formacionAcademica?.name()},
                                       data-fechaingreso=${p.fechaIngreso},
                                       data-fechacese=${p.fechaCese},
                                       data-modalidad=${p.modalidadTrabajo?.name()},
                                       data-skill=${p.skillPrincipal?.name()}"
                              onclick="abrirModalEditar(this)">
                        <i class="bx bxs-edit"></i>
                      </button>

                    </div>
                  </td>
                  <td th:text="${p.apellidos}"></td>
                  <td th:text="${p.nombres}"></td>
                  <td th:text="${p.dniCe}"></td>

                  <!-- Con el enum en el DTO basta con pedir su descripcion: se
                       acabaron las escaleras de th:switch/th:case por catalogo. -->
                  <td th:text="${p.sexo?.descripcion}"></td>
                  <td th:text="${p.estadoCivil?.descripcion}"></td>
                  <td th:text="${p.nacionalidad?.descripcion}"></td>
                  <td th:text="${p.celular}"></td>
                  <td th:text="${p.email}"></td>
                  <td th:text="${p.formacionAcademica?.descripcion}"></td>
                  <td th:text="${p.modalidadTrabajo?.descripcion}"></td>
                  <td th:text="${p.skillPrincipal?.descripcion}"></td>
                  <td>
                    <span class="badge rounded-pill p-2 text-uppercase px-3"
                          th:classappend="${p.estado?.name() == 'ACTIVO'}
                                          ? 'text-success bg-light-success'
                                          : (${p.estado?.name() == 'ELIMINADO'}
                                             ? 'text-danger bg-light-danger'
                                             : 'text-secondary bg-light')"
                          th:text="${p.estado?.descripcion}">
                    </span>
                  </td>
                </tr>

              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalPersona" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title text-secondary" id="modalPersonaTitulo">
            Registro de Personal
          </h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="formPersona" th:action="@{/personas}" method="post">
          <div class="modal-body">

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Apellidos</label>
                <input type="text" name="apellidos" id="inputApellidos"
                       class="form-control" maxlength="200" required/>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Nombres</label>
                <input type="text" name="nombres" id="inputNombres"
                       class="form-control" maxlength="200" required/>
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label text-primary">DNI / CE</label>
                <input type="text" name="dniCe" id="inputDni"
                       class="form-control" maxlength="12" required/>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label text-primary">Sexo</label>
                <select class="form-select" name="sexo" id="selectSexo" required>
                  <option value="">-- Seleccionar --</option>
                  <option th:each="s : ${sexos}"
                          th:value="${s.name()}"
                          th:text="${s.descripcion}"></option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label text-primary">Fecha de nacimiento</label>
                <input type="date" name="fechaNacimiento" id="inputFechaNacimiento"
                       class="form-control" required/>
              </div>
            </div>

            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label text-primary">Estado civil</label>
                <select class="form-select" name="estadoCivil" id="selectEstadoCivil" required>
                  <option value="">-- Seleccionar --</option>
                  <option th:each="e : ${estadosCiviles}"
                          th:value="${e.name()}"
                          th:text="${e.descripcion}"></option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label text-primary">Nacionalidad</label>
                <select class="form-select" name="nacionalidad" id="selectNacionalidad" required>
                  <option value="">-- Seleccionar --</option>
                  <option th:each="n : ${nacionalidades}"
                          th:value="${n.name()}"
                          th:text="${n.descripcion}"></option>
                </select>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label text-primary">Celular</label>
                <input type="text" name="celular" id="inputCelular"
                       class="form-control" pattern="9\d{8}"
                       title="Debe empezar con 9 y tener 9 dígitos" required/>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Email</label>
                <input type="email" name="email" id="inputEmail"
                       class="form-control" maxlength="100" required/>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Formación académica</label>
                <select class="form-select" name="formacionAcademica" id="selectFormacion" required>
                  <option value="">-- Seleccionar --</option>
                  <option th:each="f : ${formaciones}"
                          th:value="${f.name()}"
                          th:text="${f.descripcion}"></option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Fecha de ingreso</label>
                <input type="date" name="fechaIngreso" id="inputFechaIngreso"
                       class="form-control" required/>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Fecha de cese</label>
                <input type="date" name="fechaCese" id="inputFechaCese"
                       class="form-control"/>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Modalidad de trabajo</label>
                <select class="form-select" name="modalidadTrabajo" id="selectModalidad" required>
                  <option value="">-- Seleccionar --</option>
                  <option th:each="m : ${modalidades}"
                          th:value="${m.name()}"
                          th:text="${m.descripcion}"></option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Skill principal</label>
                <select class="form-select" name="skillPrincipal" id="selectSkill" required>
                  <option value="">-- Seleccionar --</option>
                  <option th:each="s : ${skills}"
                          th:value="${s.name()}"
                          th:text="${s.descripcion}"></option>
                </select>
              </div>
            </div>

          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">Cerrar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</div>

<th:block layout:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script th:inline="javascript">
    const URL_PERSONAS = /*[[@{/personas}]]*/ '/personas';
  </script>
  <script th:src="@{/js/personas/index.js}"></script>
</th:block>

</body>
</html>
