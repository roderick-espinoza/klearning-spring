<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
  <title>Usuarios</title>
</head>
<body>

<div layout:fragment="content">

  <div th:replace="~{fragments/metrics :: metrics}"></div>

  <div class="page-breadcrumb d-none d-sm-flex align-items-center mb-3">
    <div class="breadcrumb-title pe-3">Tablas</div>
    <div class="ps-3">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0 p-0">
          <li class="breadcrumb-item">
            <a href="javascript:;"><i class="bx bx-home-alt"></i></a>
          </li>
          <li class="breadcrumb-item active" aria-current="page">Tabla de Usuarios</li>
        </ol>
      </nav>
    </div>
  </div>

  <hr/>

  <div class="row">
    <div class="col">
      <div class="card radius-10 mb-0">
        <div class="card-body">

          <div class="d-flex align-items-center mb-3">
            <h5 class="mb-0 text-primary">Listado de Usuarios</h5>
            <div class="ms-auto">
              <button type="button"
                      class="btn btn-primary rounded-pill"
                      onclick="abrirModalNuevo()"
                      data-bs-toggle="modal"
                      data-bs-target="#modalUsuario">
                <i class="bi bi-folder-plus"></i> Nuevo Usuario
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Acciones</th>
                  <th>Usuario</th>
                  <th>Apellidos</th>
                  <th>Nombres</th>
                  <th>DNI</th>
                  <th>Roles</th>
                  <th>Estado</th>
                  <th>Creador</th>
                  <th>F. Creación</th>
                </tr>
              </thead>
              <tbody>

                <tr th:if="${#lists.isEmpty(lista)}">
                  <td colspan="9" class="text-center text-muted">
                    No hay usuarios registrados
                  </td>
                </tr>

                <tr th:each="u : ${lista}">
                  <td>
                    <div class="d-flex order-actions">

                      <form th:action="@{/usuarios/eliminar/{id}(id=${u.idUsuario})}"
                            method="post"
                            onsubmit="return confirmarEliminar(event)">
                        <button type="submit"
                                class="text-danger bg-light-danger border-0 btn-accion">
                          <i class="bx bxs-trash"></i>
                        </button>
                      </form>

                      <!-- data-roles lleva los ids separados por coma: el JS los
                           usa para marcar varias opciones del select multiple. -->
                      <button type="button"
                              class="ms-2 text-primary bg-light-primary border-0 btn-accion"
                              data-bs-toggle="modal"
                              data-bs-target="#modalUsuario"
                              th:attr="data-id=${u.idUsuario},
                                       data-usuario=${u.usuario},
                                       data-persona=${u.persona?.idPersona},
                                       data-roles=${#strings.listJoin(u.roles.![idRol], ',')}"
                              onclick="abrirModalEditar(this)">
                        <i class="bx bxs-edit"></i>
                      </button>

                    </div>
                  </td>
                  <td th:text="${u.usuario}"></td>
                  <td th:text="${u.persona?.apellidos}"></td>
                  <td th:text="${u.persona?.nombres}"></td>
                  <td th:text="${u.persona?.dniCe}"></td>
                  <td>
                    <span class="badge rounded-pill text-info bg-light-info px-3 py-2 me-1"
                          th:each="rol : ${u.roles}"
                          th:text="${rol.nombreRol}"></span>
                  </td>
                  <td>
                    <span class="badge rounded-pill p-2 text-uppercase px-3"
                          th:classappend="${u.estado?.name() == 'ACTIVO'}
                                          ? 'text-success bg-light-success'
                                          : (${u.estado?.name() == 'ELIMINADO'}
                                             ? 'text-danger bg-light-danger'
                                             : 'text-secondary bg-light')"
                          th:text="${u.estado?.descripcion}">
                    </span>
                  </td>
                  <td th:text="${u.createUser}"></td>
                  <td th:text="${u.createDate != null ? #temporals.format(u.createDate, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                </tr>

              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title text-secondary" id="modalUsuarioTitulo">
            Registro de Usuarios
          </h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="formUsuario" th:action="@{/usuarios}" method="post">
          <div class="modal-body">

            <div class="row">
              <div class="col-md-12 mb-3">
                <label class="form-label text-primary">Persona</label>
                <select class="form-select" name="idPersona" id="selectPersona" required>
                  <option value="">-- Seleccionar --</option>
                  <option th:each="p : ${personas}"
                          th:value="${p.idPersona}"
                          th:text="|${p.apellidos}, ${p.nombres} (${p.dniCe})|"></option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Usuario</label>
                <input type="text" name="usuario" id="inputUsuario"
                       class="form-control" maxlength="100" required/>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label text-primary">Contraseña</label>
                <input type="password" name="password" id="inputPassword"
                       class="form-control" minlength="8" maxlength="300"/>
                <div class="form-text" id="ayudaPassword">
                  Mínimo 8 caracteres.
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-12 mb-3">
                <label class="form-label text-primary">Roles</label>
                <!-- Un usuario puede tener varios roles: cada seleccion se
                     traduce en una fila de la tabla usuarios_roles. -->
                <select class="form-select" name="idsRoles" id="selectRoles"
                        multiple size="6" required>
                  <option th:each="r : ${roles}"
                          th:value="${r.idRol}"
                          th:text="|${r.nombreRol} (${r.codigoRol})|"></option>
                </select>
                <div class="form-text">
                  Mantén pulsado Ctrl (o Cmd) para seleccionar varios.
                </div>
              </div>
            </div>

          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">Cerrar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>

      </div>
    </div>
  </div>

</div>

<th:block layout:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script th:inline="javascript">
    const URL_USUARIOS = /*[[@{/usuarios}]]*/ '/usuarios';
  </script>
  <script th:src="@{/js/usuarios/index.js}"></script>
</th:block>

</body>
</html>
